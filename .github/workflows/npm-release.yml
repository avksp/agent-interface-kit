name: npm release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to npm
        type: boolean
        default: false

permissions:
  contents: read

env:
  NPM_BOOTSTRAP_SHA512: "a2f98d4517bbe89bdca7513a88e78f43a1fd66be1730eaea81f69e18d86d46f3f75d29762e8fdaf42d4de7f8d194b2ebb2a09e9bfa268067591e96796baca7d5"

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha: ${{ steps.package.outputs.manifest-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the verified npm CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-12.2.3.tgz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --output "$archive" \
            https://registry.npmjs.org/npm/-/npm-12.2.3.tgz
          printf '%s  %s\n' "$NPM_BOOTSTRAP_SHA512" "$archive" | shasum -a 512 -c -
          npm install --global --ignore-scripts --no-audit --no-fund "$archive"
          test "$(npm --version)" = 12.2.3
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - id: package
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/cli/package.json").version')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$PUBLISH" == true ]]; then
            test "$(git rev-parse "refs/tags/v${version}^{commit}")" = "$GITHUB_SHA"
          fi
          node tools/pack-npm.mjs
          npm run check
          node tools/smoke-npm.mjs "dist/npm/agent-interface-kit-${version}.tgz"
          test -z "$(git status --porcelain)"
          manifest_sha="$(shasum -a 256 dist/npm/manifest.json | cut -d ' ' -f 1)"
          printf 'manifest-sha=%s\n' "$manifest_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: aik-npm
          path: dist/npm/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install the verified npm CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/npm-12.2.3.tgz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --output "$archive" \
            https://registry.npmjs.org/npm/-/npm-12.2.3.tgz
          printf '%s  %s\n' "$NPM_BOOTSTRAP_SHA512" "$archive" | shasum -a 512 -c -
          npm install --global --ignore-scripts --no-audit --no-fund "$archive"
          test "$(npm --version)" = 12.2.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: package
      - name: Verify and publish the tested tarball
        env:
          MANIFEST_SHA: ${{ needs.build.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          tarball="$(node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync } from "node:fs";
          const hash = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
          const record = "package/manifest.json";
          assert.equal(hash(record), process.env.MANIFEST_SHA);
          const manifest = JSON.parse(readFileSync(record, "utf8"));
          assert.match(manifest.version, /^[0-9]+\.[0-9]+\.[0-9]+$/u);
          assert.equal(manifest.commit, process.env.GITHUB_SHA);
          assert.equal(manifest.name, "agent-interface-kit");
          assert.equal(manifest.tag, "v" + manifest.version);
          assert.equal(manifest.tarball, manifest.name + "-" + manifest.version + ".tgz");
          assert.deepEqual(readdirSync("package").sort(), [manifest.tarball, "manifest.json"].sort());
          const tarball = "package/" + manifest.tarball;
          assert.equal(hash(tarball), manifest.sha256);
          const paths = execFileSync("tar", ["-tzf", tarball], { encoding: "utf8" }).trimEnd().split("\n");
          assert.deepEqual(paths.sort(), manifest.files.map((path) => "package/" + path).sort());
          const metadata = JSON.parse(execFileSync("tar", ["-xOzf", tarball, "package/package.json"], { encoding: "utf8" }));
          assert.equal(metadata.name, manifest.name);
          assert.equal(metadata.version, manifest.version);
          console.log(tarball);
          JS
          )"
          npm publish "./$tarball" --access public --ignore-scripts
