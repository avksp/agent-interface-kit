name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global --ignore-scripts --no-audit --no-fund npm@12.2.3
      - run: test "$(node -p 'process.platform + "/" + process.arch')" = darwin/arm64
      - run: npm ci --ignore-scripts
      - run: npm run build:secure-fs
      - run: npm run check
      - run: npm run audit:deps
